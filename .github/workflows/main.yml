name: Build AX53 Firmware
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binwalk mtd-utils squashfs-tools u-boot-tools python3 python3-pip
          sudo pip3 install ubi_reader --break-system-packages || sudo pip3 install ubi_reader

      - name: Build helper binaries
        run: |
          make || true
          chmod +x *.sh

      - name: Unpack, enable SSH, and repack
        run: |
          sudo ./01-unpack.sh "ax53v1-up-all-ver1-1-1-P1[20220609-rel63858]_sign_2022-06-09_17.52.28.bin"
          
          # Включаем автозапуск SSH (dropbear) при старте роутера
          if [ -f squashfs-root/etc/init.d/dropbear ]; then
            sudo sed -i 's/ENABLE=0/ENABLE=1/g' squashfs-root/etc/init.d/dropbear || true
            sudo ln -sf ../init.d/dropbear squashfs-root/etc/rc.d/S50dropbear
          fi
          
          # Разрешаем вход по SSH с паролем роутера
          if [ -f squashfs-root/etc/config/dropbear ]; then
            sudo sed -i "s/option PasswordAuth.*/option PasswordAuth 'on'/g" squashfs-root/etc/config/dropbear || true
            sudo sed -i "s/option RootPasswordAuth.*/option RootPasswordAuth 'on'/g" squashfs-root/etc/config/dropbear || true
          fi

          sudo ./02-repack.sh ax53v1-ssh-mod.bin
          sudo chown $USER:$USER ax53v1-ssh-mod.bin

      - name: Upload modified firmware
        uses: actions/upload-artifact@v4
        with:
          name: modified-ax53-firmware
          path: ax53v1-ssh-mod.bin
