name: Build AX53 Firmware
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binwalk mtd-utils squashfs-tools u-boot-tools python3 python3-pip
          sudo pip3 install --ignore-installed --break-system-packages ubi_reader

      - name: Build helper binaries
        run: |
          make || true
          chmod +x *.sh

      - name: Unpack, inspect, enable SSH/Telnet, and repack
        run: |
          sudo ./01-unpack.sh "ax53v1-up-all-ver1-1-1-P1[20220609-rel63858]_sign_2022-06-09_17.52.28.bin"
          
          echo "=== Службы в init.d ==="
          ls -la squashfs-root/etc/init.d/
          echo "=== Поиск dropbear и telnetd ==="
          find squashfs-root/ -name "*dropbear*" -o -name "*telnet*"
          echo "=== Содержимое rc.local ==="
          cat squashfs-root/etc/rc.local || true

          # Прописываем принудительный запуск dropbear и telnetd в rc.local
          sudo sed -i '/exit 0/i /usr/sbin/dropbear -p 22 &' squashfs-root/etc/rc.local || true
          sudo sed -i '/exit 0/i /usr/sbin/telnetd -l /bin/login.sh &' squashfs-root/etc/rc.local || true

          sudo ./02-repack.sh ax53v1-ssh-mod.bin
          sudo chown $USER:$USER ax53v1-ssh-mod.bin

      - name: Upload modified firmware
        uses: actions/upload-artifact@v4
        with:
          name: modified-ax53-firmware
          path: ax53v1-ssh-mod.bin
